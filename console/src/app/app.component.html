<div class="cloudscale-layout">
  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="navbar-brand">
      <a routerLink="/" class="brand-link">
        <div class="brand-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 18H6C4.34315 18 3 16.6569 3 15C3 13.5789 3.98595 12.3887 5.32759 12.0835C5.11582 11.4393 5 10.7381 5 10C5 6.68629 7.68629 4 11 4C13.637 4 15.8675 5.70327 16.6577 8.08342C17.0722 8.02867 17.5197 8 18 8C20.7614 8 23 10.2386 23 13C23 15.7614 20.7614 18 18 18H19Z" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="brand-name">CloudScale</span>
      </a>
      <span class="badge-env">CONTROL PLANE</span>

      <nav class="nav-links">
        <a routerLink="/health" routerLinkActive="active" class="nav-link">System Health</a>
      </nav>
    </div>

    <div class="navbar-actions">
      <!-- Unauthenticated Menu -->
      <ng-container *ngIf="!authService.isAuthenticated()">
        <a routerLink="/login" routerLinkActive="active" class="btn-nav">Sign In</a>
        <a routerLink="/register" routerLinkActive="active" class="btn-nav-primary">Register Org</a>
      </ng-container>

      <!-- Authenticated User Menu -->
      <ng-container *ngIf="authService.isAuthenticated()">
        <div class="user-badge-container">
          <span class="org-name">{{ authService.currentOrg()?.name }}</span>
          <span class="divider">/</span>
          <span class="user-name">{{ authService.currentUser()?.fullName }}</span>
          <span class="role-pill">{{ authService.userRole() }}</span>
        </div>
        <button class="btn-logout" (click)="logout()" aria-label="Sign out">
          Sign Out
        </button>
      </ng-container>

      <button class="btn-theme-toggle" (click)="toggleTheme()" [attr.aria-label]="isDarkMode() ? 'Switch to light theme' : 'Switch to dark theme'">
        {{ isDarkMode() ? '☀️' : '🌙' }}
      </button>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
