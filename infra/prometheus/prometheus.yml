global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'control-plane'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['control-plane:8080']

  - job_name: 'ai-service'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['ai-service:8000']
